<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" role="img" aria-labelledby="t d">
<title id="t">FemmForce — Direction B, "Loom"</title>
<desc id="d">Indigo-dominant homepage direction with a visible warp-and-weft rule grid, khadi cotton panels, madder red flags.</desc>
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&amp;family=Karla:wght@400;500;600&amp;display=swap');
.disp { font-family:'Fraunces','Georgia',serif; font-weight:300; fill:#E4DCC9; }
.dispd{ font-family:'Fraunces','Georgia',serif; font-weight:300; fill:#15243C; }
.b   { font-family:'Karla','Helvetica Neue',sans-serif; }
.mut { fill:#93A1B8; }
.dim { fill:#6E6553; }
</style>
</defs>

<rect width="1280" height="880" fill="#15243C"/>

<!-- top contact bar -->
<rect width="1280" height="34" fill="#0D1729"/>
<text class="b mut" x="48" y="22" font-size="11.5">info@femmforce.in</text>
<text class="b mut" x="196" y="22" font-size="11.5">+91 98804 38607</text>
<text class="b" x="1232" y="22" font-size="11.5" fill="#E4DCC9" text-anchor="end">Donate</text>
<rect x="1150" y="8" width="1" height="18" fill="#2E3F5E"/>
<text class="b mut" x="1136" y="22" font-size="11.5" text-anchor="end">Log in</text>

<!-- masthead -->
<text class="b" x="48" y="76" font-size="19" letter-spacing="1.6" font-weight="600" fill="#E4DCC9">FEMMFORCE</text>
<g class="b mut" font-size="12.5" letter-spacing="0.6">
<text x="640" y="76">About</text><text x="712" y="76">Beneficiaries</text><text x="822" y="76">Training</text>
<text x="898" y="76">Partners</text><text x="978" y="76">Membership</text><text x="1082" y="76">Events</text><text x="1146" y="76">Media</text>
</g>
<rect x="0" y="96" width="1280" height="1" fill="#2E3F5E"/>

<!-- WARP: vertical hairlines, 4 columns -->
<g fill="#2E3F5E">
<rect x="48"   y="96" width="1" height="464"/>
<rect x="344"  y="96" width="1" height="464"/>
<rect x="640"  y="96" width="1" height="464"/>
<rect x="936"  y="96" width="1" height="464"/>
<rect x="1231" y="96" width="1" height="464"/>
</g>
<!-- WEFT: horizontal hairlines -->
<g fill="#22314D">
<rect x="48" y="188" width="1184" height="1"/>
<rect x="48" y="498" width="888" height="1"/>
</g>

<!-- hero headline, spans 3 warp columns -->
<text class="disp" x="78" y="288" font-size="66">Not a conversation</text>
<text class="disp" x="78" y="356" font-size="66">about women.</text>
<text class="disp" x="78" y="424" font-size="66">A structure under them.</text>

<text class="b mut" x="78" y="536" font-size="14.5">FemmForce is a Bangalore trust that builds the practical scaffolding —</text>
<text class="b mut" x="78" y="558" font-size="14.5">training, funding, employment, legal protection — women are told to manage without.</text>

<!-- madder flag on the primary action -->
<rect x="78" y="452" width="3" height="26" fill="#A6392E"/>
<text class="b" x="96" y="472" font-size="14" font-weight="600" fill="#E4DCC9">Registered trust · Est. 2023 · Bengaluru</text>

<!-- khadi cell, right warp column, unequal span -->
<rect x="937" y="97" width="294" height="463" fill="#E4DCC9"/>
<text class="dispd" x="965" y="168" font-size="52">300+</text>
<text class="b dim" x="965" y="196" font-size="13">qualified trainers in network</text>
<rect x="965" y="228" width="238" height="1" fill="#C9BFA8"/>
<text class="dispd" x="965" y="292" font-size="52">20+</text>
<text class="b dim" x="965" y="320" font-size="13">organisations served as POSH</text>
<text class="b dim" x="965" y="338" font-size="13">external committee members</text>
<rect x="965" y="370" width="238" height="1" fill="#C9BFA8"/>
<text class="dispd" x="965" y="434" font-size="52">9</text>
<text class="b dim" x="965" y="462" font-size="13">training programmes delivered</text>
<text class="b dim" x="965" y="480" font-size="13">to corporates and institutions</text>
<rect x="965" y="516" width="60" height="2" fill="#A6392E"/>

<!-- beneficiary band: four unequal loom cells on khadi -->
<rect x="0" y="560" width="1280" height="184" fill="#E4DCC9"/>
<g fill="#C9BFA8">
<rect x="344" y="560" width="1" height="184"/><rect x="640" y="560" width="1" height="184"/><rect x="936" y="560" width="1" height="184"/>
</g>
<g class="dispd" font-size="25">
<text x="78" y="626">Women at Business</text><text x="374" y="626">Women at Work</text>
<text x="670" y="626">Women at Home</text><text x="966" y="626">Underprivileged</text>
</g>
<g class="b dim" font-size="12.5">
<text x="78" y="662">Startup, Maverick and</text><text x="78" y="680">Aspiring Divas.</text>
<text x="374" y="662">Rising Stars, Career</text><text x="374" y="680">Thrivers, Re-entry.</text>
<text x="670" y="662">Financial independence,</text><text x="670" y="680">legal rights, health.</text>
<text x="966" y="662">Livelihood support and</text><text x="966" y="680">government schemes.</text>
</g>
<g fill="#A6392E"><rect x="78" y="704" width="22" height="2"/><rect x="374" y="704" width="22" height="2"/><rect x="670" y="704" width="22" height="2"/><rect x="966" y="704" width="22" height="2"/></g>

<!-- closing band -->
<text class="disp" x="78" y="812" font-size="34">“Businesses seek efficiency and implementation,</text>
<text class="disp" x="78" y="852" font-size="34">rather than just talk about feminism.”</text>
<rect x="1076" y="796" width="156" height="44" fill="#A6392E"/>
<text class="b" x="1154" y="823" font-size="13.5" font-weight="600" fill="#E4DCC9" text-anchor="middle">Training enquiry</text>
</svg>
